kind = "mobile"
previewPath = "/"
title = "ConvR"
version = "1.0.0"
id = "artifacts/convr"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24774

[services.development]
run = "pnpm --filter @workspace/convr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/convr", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/convr", "run", "serve" ]

[services.env]
PORT = "24774"
BASE_PATH = "/"
